
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --cov=pricing --cov-report=term-missing --cov-report=markdown:coverage.md --cov-fail-under=90

      - name: Coverage summary
        if: always()
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install security tools
        run: python -m pip install bandit pip-audit

      - name: Scan Python code
        run: bandit -r . -x ./tests

      - name: Scan dependencies
        run: pip-audit -r requirements.txt

  ready:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm readiness
        run: echo "Lint and all tests passed. Ready to merge."
